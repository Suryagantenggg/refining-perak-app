<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refining Perak System - Multi Select Penjualan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // URL Web App Google Apps Script Terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZaa5EJw_9tz2egLlmuceADVcF9n7Bv0W9i2JcAT3zeD-PVh9J2vXEuFgIbZeDn02l/exec";

    const DEFAULT_CATEGORIES = [
      { code: 'A', name: 'Pentolan Kontaktor' },
      { code: 'B', name: 'Kontak Point' },
      { code: 'C', name: 'Ex Breaker' },
      { code: 'D', name: 'Mata Ikan (Ex Relay)' },
      { code: 'E', name: 'Mata Ikan (Ex Kontaktor)' },
      { code: 'F', name: 'Tembaga Plating Perak' },
      { code: 'G', name: 'Fuse' },
      { code: 'H', name: 'Patung' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('perak_user_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [signupNama, setSignupNama] = useState('');
      const [signupUsername, setSignupUsername] = useState('');
      const [signupPassword, setSignupPassword] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);

      const [newCatCode, setNewCatCode] = useState('');
      const [newCatName, setNewCatName] = useState('');
      const [editingCatCode, setEditingCatCode] = useState(null);
      const [editCatNameText, setEditCatNameText] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const loadCategoriesFromSheets = () => {
        fetch(SCRIPT_URL + '?type=categories&t=' + new Date().getTime())
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 1) {
              const formattedCats = data.slice(1).map(row => ({
                code: String(row[0] || '').trim(),
                name: String(row[1] || '').trim()
              })).filter(c => c.code && c.name);

              if (formattedCats.length > 0) setCategories(formattedCats);
            }
          })
          .catch(err => console.error("Gagal load kategori:", err));
      };

      const saveCategoriesToSheets = (newCatsList) => {
        setLoading(true);
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'SAVE_CATEGORIES', categories: newCatsList })
        })
        .then(() => {
          setTimeout(() => {
            setLoading(false);
            setCategories(newCatsList);
            showToast('✅ Varian Barang berhasil disimpan ke Google Sheets!');
          }, 1500);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal menyimpan varian barang!');
        });
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setAuthError('');

        fetch(SCRIPT_URL + '?type=users&t=' + new Date().getTime())
          .then(res => res.json())
          .then(usersData => {
            setLoading(false);
            if (Array.isArray(usersData) && usersData.length > 1) {
              const userMatch = usersData.slice(1).find(row => 
                String(row[1]).trim().toLowerCase() === loginUsername.trim().toLowerCase() && 
                String(row[2]).trim() === loginPassword.trim()
              );

              if (userMatch) {
                const userObj = { nama: userMatch[0], username: userMatch[1], role: userMatch[3] || 'Petugas' };
                setCurrentUser(userObj);
                localStorage.setItem('perak_user_session', JSON.stringify(userObj));
                showToast(`Selamat datang, ${userObj.nama}!`);
              } else {
                setAuthError('Username atau Password salah!');
              }
            } else {
              setAuthError('Data akun tidak ditemukan!');
            }
          })
          .catch(() => {
            setLoading(false);
            setAuthError('Gagal menghubungkan ke database user.');
          });
      };

      const handleSignUpSubmit = (e) => {
        e.preventDefault();
        if (!signupNama.trim() || !signupUsername.trim() || !signupPassword.trim()) {
          return setAuthError('Semua bidang harus diisi!');
        }

        setLoading(true);
        setAuthError('');

        const payload = {
          action: 'REGISTER_USER',
          nama: signupNama.trim(),
          username: signupUsername.trim(),
          password: signupPassword.trim(),
          role: 'Petugas'
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(() => {
          setTimeout(() => {
            setLoading(false);
            setAuthSuccess('🎉 Akun berhasil dibuat! Silakan masuk.');
            setLoginUsername(signupUsername.trim());
            setSignupNama('');
            setSignupUsername('');
            setSignupPassword('');
            setAuthMode('login');
          }, 2000);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal mendaftarkan akun.');
        });
      };

      const handleLogout = () => {
        if (window.confirm('Yakin ingin keluar dari sistem?')) {
          setCurrentUser(null);
          localStorage.removeItem('perak_user_session');
        }
      };

      const loadDataFromSheets = () => {
        if (!currentUser) return;
        setLoading(true);
        loadCategoriesFromSheets();

        fetch(SCRIPT_URL + '?t=' + new Date().getTime())
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 1) {
              const formattedTrx = data.slice(1).map((row) => {
                const totalJual = parseFloat(row[27]) || 0;
                const murni = parseFloat(row[10]) || 0;
                let status = 'MENUNGGU_OLAH';
                if (totalJual > 0) status = 'TERJUAL';
                else if (murni > 0) status = 'SELESAI_OLAH';

                return {
                  id: String(row[0] || '').trim(),
                  tanggalAmbil: row[1] || '',
                  kategoriName: row[2] || '',
                  pengambil: row[3] || '',
                  tempatAmbil: row[4] || '-',
                  lokasiAmbil: row[5] || '-',
                  jumlahKotor: parseFloat(row[6]) || 0,
                  totalBeli: parseFloat(row[7]) || 0,
                  biayaTransport: parseFloat(row[8]) || 0,
                  pengolah: row[9] || '-',
                  jumlahMurni: murni,
                  biayaOlah: parseFloat(row[11]) || 0,
                  efisiensi: parseFloat(row[12]) || 0,
                  tanggalPenjualan: row[21] || '-',
                  tokoPembeli: row[28] || '-',
                  jumlahJual: parseFloat(row[25]) || 0,
                  hargaJualSatuan: parseFloat(row[26]) || 0,
                  totalJual: totalJual,
                  biayaPenjualan: parseFloat(row[29]) || 0,
                  totalUntung: totalJual > 0 ? (totalJual - (parseFloat(row[7]) || 0) - (parseFloat(row[8]) || 0) - (parseFloat(row[11]) || 0) - (parseFloat(row[29]) || 0)) : 0,
                  status: status
                };
              }).filter(t => t.id !== '');
              setTransactions(formattedTrx);
            } else {
              setTransactions([]);
            }
            setLoading(false);
          })
          .catch(err => {
            console.error("Gagal ambil data Sheets:", err);
            setLoading(false);
          });
      };

      useEffect(() => {
        if (currentUser) loadDataFromSheets();
      }, [currentUser]);

      // FORM PEMBELIAN
      const [formAmbil, setFormAmbil] = useState({
        tanggal: new Date().toISOString().split('T')[0],
        pengambilSelect: currentUser ? currentUser.nama : 'Andi',
        tempatAmbil: '',
        lokasiAmbil: '',
        kategoriCode: 'A',
        jumlahKotor: '',
        hargaBeliSatuan: '',
        biayaTransport: ''
      });

      // FORM PENGOLAHAN (MULTI-SELECT)
      const [formOlah, setFormOlah] = useState({
        selectedTrxIds: [],
        pengolahSelect: currentUser ? currentUser.nama : 'Zaenal',
        jumlahMurni: '',
        biayaOlah: ''
      });

      // FORM PENJUALAN (MULTI-SELECT)
      const [formJual, setFormJual] = useState({
        selectedTrxIds: [],
        tanggalJual: new Date().toISOString().split('T')[0],
        hargaJualSatuan: '',
        biayaPenjualan: ''
      });

      const formatRupiah = (val) => {
        if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
      };

      const sendToGoogleSheets = (dataObj, successMessage) => {
        setLoading(true);
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataObj)
        })
        .then(() => {
          setTimeout(() => {
            loadDataFromSheets();
            setLoading(false);
            showToast(successMessage || '✅ Data tersimpan di Sheet Transaksi!');
          }, 2500);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal mengirim data!');
        });
      };

      const handleDeleteTransaction = (id) => {
        if (window.confirm(`Yakin ingin menghapus data transaksi ${id} dari Sheet Transaksi?`)) {
          sendToGoogleSheets({ action: 'DELETE', id: id }, `🗑️ Transaksi ${id} berhasil dihapus!`);
        }
      };

      const handleSavePengambilan = (e) => {
        e.preventDefault();
        const kotor = parseFloat(formAmbil.jumlahKotor) || 0;
        const hargaBeli = parseFloat(formAmbil.hargaBeliSatuan) || 0;
        const transport = parseFloat(formAmbil.biayaTransport) || 0;

        const selectedCat = categories.find(c => c.code === formAmbil.kategoriCode) || categories[0];

        const payload = {
          tanggalAmbil: formAmbil.tanggal,
          kategoriName: `[${selectedCat.code}] ${selectedCat.name}`,
          pengambil: formAmbil.pengambilSelect,
          tempatAmbil: formAmbil.tempatAmbil,
          lokasiAmbil: formAmbil.lokasiAmbil,
          jumlahKotor: kotor,
          totalBeli: kotor * hargaBeli,
          biayaTransport: transport
        };

        sendToGoogleSheets(payload, '🎉 Transaksi Pembelian baru berhasil masuk ke Sheet Transaksi!');
        setFormAmbil({ ...formAmbil, tempatAmbil: '', lokasiAmbil: '', jumlahKotor: '', hargaBeliSatuan: '', biayaTransport: '' });
        setActiveTab('dashboard');
      };

      // TOGGLE SELECT PENGOLAHAN
      const handleToggleSelectOlah = (id) => {
        const current = formOlah.selectedTrxIds;
        if (current.includes(id)) setFormOlah({ ...formOlah, selectedTrxIds: current.filter(x => x !== id) });
        else setFormOlah({ ...formOlah, selectedTrxIds: [...current, id] });
      };

      // TOGGLE SELECT PENJUALAN
      const handleToggleSelectJual = (id) => {
        const current = formJual.selectedTrxIds;
        if (current.includes(id)) setFormJual({ ...formJual, selectedTrxIds: current.filter(x => x !== id) });
        else setFormJual({ ...formJual, selectedTrxIds: [...current, id] });
      };

      const selectedTrxOlahList = transactions.filter(t => formOlah.selectedTrxIds.includes(t.id));
      const totalKotorSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.jumlahKotor, 0);

      const murniVal = parseFloat(formOlah.jumlahMurni) || 0;
      const totalBiayaOlahVal = parseFloat(formOlah.biayaOlah) || 0;

      const handleSavePengolahan = (e) => {
        e.preventDefault();
        if (formOlah.selectedTrxIds.length === 0) return alert('Pilih minimal 1 transaksi!');
        if (murniVal <= 0) return alert('Hasil Perak Murni harus > 0!');

        const updatedItems = selectedTrxOlahList.map(t => {
          const porsiGram = t.jumlahKotor / totalKotorSelected;
          const murniItem = parseFloat((murniVal * porsiGram).toFixed(2));
          const biayaItem = parseFloat((totalBiayaOlahVal * porsiGram).toFixed(0));
          const efisiensiItem = parseFloat(((murniItem / t.jumlahKotor) * 100).toFixed(2));

          return {
            ...t,
            pengolah: formOlah.pengolahSelect.trim(),
            jumlahMurni: murniItem,
            biayaOlah: biayaItem,
            efisiensi: efisiensiItem
          };
        });

        sendToGoogleSheets({ action: 'BATCH_UPDATE_OLAH', items: updatedItems }, '🧪 Data Pemurnian berhasil di-update di Sheet Transaksi!');
        setFormOlah({ selectedTrxIds: [], pengolahSelect: currentUser.nama, jumlahMurni: '', biayaOlah: '' });
        setActiveTab('dashboard');
      };

      // PROSES PENJUALAN MULTI-SELECT
      const selectedTrxJualList = transactions.filter(t => formJual.selectedTrxIds.includes(t.id));
      const totalMurniJualSelected = selectedTrxJualList.reduce((sum, t) => sum + t.jumlahMurni, 0);
      const hargaJualVal = parseFloat(formJual.hargaJualSatuan) || 0;
      const totalBiayaPenjualanVal = parseFloat(formJual.biayaPenjualan) || 0;

      const handleSavePenjualan = (e) => {
        e.preventDefault();
        if (formJual.selectedTrxIds.length === 0) return alert('Pilih minimal 1 barang hasil olahan yang akan dijual!');
        if (hargaJualVal <= 0) return alert('Harga jual per gram harus > 0!');

        const updatedItems = selectedTrxJualList.map(t => {
          const porsiMurni = t.jumlahMurni / totalMurniJualSelected;
          const totalJualItem = parseFloat((t.jumlahMurni * hargaJualVal).toFixed(0));
          const biayaPenjualanItem = parseFloat((totalBiayaPenjualanVal * porsiMurni).toFixed(0));

          return {
            ...t,
            tanggalJual: formJual.tanggalJual,
            jumlahJual: t.jumlahMurni,
            hargaJualSatuan: hargaJualVal,
            totalJual: totalJualItem,
            picPenjual: currentUser.nama,
            biayaPenjualan: biayaPenjualanItem
          };
        });

        sendToGoogleSheets({ action: 'BATCH_UPDATE_PENJUALAN', items: updatedItems }, `💰 Penjualan ${updatedItems.length} barang berhasil dicatat di Sheet Transaksi!`);
        setFormJual({ selectedTrxIds: [], tanggalJual: new Date().toISOString().split('T')[0], hargaJualSatuan: '', biayaPenjualan: '' });
        setActiveTab('dashboard');
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCatCode.trim() || !newCatName.trim()) return;
        const codeUpper = newCatCode.trim().toUpperCase();
        if (categories.some(c => c.code === codeUpper)) return alert('Kode Kategori sudah ada!');

        const updated = [...categories, { code: codeUpper, name: newCatName.trim() }];
        saveCategoriesToSheets(updated);
        setNewCatCode('');
        setNewCatName('');
      };

      const pendingOlahList = transactions.filter(t => t.status === 'MENUNGGU_OLAH');
      const pendingJualList = transactions.filter(t => t.status === 'SELESAI_OLAH');

      const filteredTransactions = transactions.filter(t => {
        const term = searchTerm.toLowerCase();
        return (
          t.id.toLowerCase().includes(term) ||
          t.kategoriName.toLowerCase().includes(term) ||
          t.pengambil.toLowerCase().includes(term) ||
          (t.tempatAmbil && t.tempatAmbil.toLowerCase().includes(term)) ||
          (t.lokasiAmbil && t.lokasiAmbil.toLowerCase().includes(term)) ||
          (t.pengolah && t.pengolah.toLowerCase().includes(term)) ||
          (t.tokoPembeli && t.tokoPembeli.toLowerCase().includes(term))
        );
      });

      const totalBarangKotor = transactions.reduce((acc, t) => acc + (t.jumlahKotor || 0), 0);
      const totalPerakMurni = transactions.reduce((acc, t) => acc + (t.jumlahMurni || 0), 0);
      const totalBeliModal = transactions.reduce((acc, t) => acc + (t.totalBeli || 0), 0);
      const totalOmsetPenjualan = transactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalJual || 0), 0);
      const totalLabaBersih = transactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalUntung || 0), 0);

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
              <h2 className="text-2xl font-bold text-slate-800 text-center mb-6">Refining Perak System</h2>
              {authError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-xs mb-4">{authError}</div>}
              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <input type="text" placeholder="Username" required value={loginUsername} onChange={e=>setLoginUsername(e.target.value)} className="w-full p-3 border rounded-xl text-sm" />
                <input type="password" placeholder="Password" required value={loginPassword} onChange={e=>setLoginPassword(e.target.value)} className="w-full p-3 border rounded-xl text-sm" />
                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl">Masuk ➔</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 font-sans">
          {loading && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center text-white font-bold">
              Menghubungkan ke Sheet Transaksi...
            </div>
          )}
          
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-40 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-amber-500 text-slate-900 px-2.5 py-1 rounded-lg font-black text-xl">Ag</div>
              <h1 className="font-bold text-lg">Refining Perak System</h1>
            </div>
            <div className="flex items-center gap-3 text-xs">
              <span>👤 <b>{currentUser.nama}</b> ({currentUser.role})</span>
              <button onClick={handleLogout} className="bg-red-500/20 text-red-300 border border-red-500/30 px-2.5 py-1 rounded font-bold">Logout</button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-6 space-y-6">
            <div className="flex bg-white p-2 rounded-xl shadow gap-2 overflow-x-auto text-xs font-bold">
              <button onClick={()=>setActiveTab('pengambilan')} className={`px-4 py-2 rounded-lg ${activeTab==='pengambilan'?'bg-amber-500 text-slate-900':'text-slate-600'}`}>📥 1. Pembelian</button>
              <button onClick={()=>setActiveTab('pengolahan')} className={`px-4 py-2 rounded-lg ${activeTab==='pengolahan'?'bg-amber-500 text-slate-900':'text-slate-600'}`}>🧪 2. Pengolahan ({pendingOlahList.length})</button>
              <button onClick={()=>setActiveTab('penjualan')} className={`px-4 py-2 rounded-lg ${activeTab==='penjualan'?'bg-amber-500 text-slate-900':'text-slate-600'}`}>💰 3. Penjualan ({pendingJualList.length})</button>
              <button onClick={()=>setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg ${activeTab==='dashboard'?'bg-amber-500 text-slate-900':'text-slate-600'}`}>📊 Laporan Transaksi</button>
            </div>

            {/* TAB 1: PEMBELIAN */}
            {activeTab === 'pengambilan' && (
              <form onSubmit={handleSavePengambilan} className="bg-white p-6 rounded-xl shadow space-y-4 max-w-xl mx-auto">
                <h3 className="font-bold text-slate-800 border-b pb-2">📥 Input Pembelian Barang Mentah</h3>
                <input type="date" value={formAmbil.tanggal} onChange={e=>setFormAmbil({...formAmbil, tanggal:e.target.value})} className="w-full p-2 border rounded text-sm" />
                <input type="text" placeholder="Tempat Ambil" value={formAmbil.tempatAmbil} onChange={e=>setFormAmbil({...formAmbil, tempatAmbil:e.target.value})} className="w-full p-2 border rounded text-sm" />
                <input type="text" placeholder="Daerah Ambil" value={formAmbil.lokasiAmbil} onChange={e=>setFormAmbil({...formAmbil, lokasiAmbil:e.target.value})} className="w-full p-2 border rounded text-sm" />
                <select value={formAmbil.kategoriCode} onChange={e=>setFormAmbil({...formAmbil, kategoriCode:e.target.value})} className="w-full p-2 border rounded text-sm">
                  {categories.map(c=><option key={c.code} value={c.code}>[{c.code}] {c.name}</option>)}
                </select>
                <div className="grid grid-cols-3 gap-2">
                  <input type="number" placeholder="Kotor (Gram)" value={formAmbil.jumlahKotor} onChange={e=>setFormAmbil({...formAmbil, jumlahKotor:e.target.value})} className="p-2 border rounded text-sm" />
                  <input type="number" placeholder="Harga Beli / Gram" value={formAmbil.hargaBeliSatuan} onChange={e=>setFormAmbil({...formAmbil, hargaBeliSatuan:e.target.value})} className="p-2 border rounded text-sm" />
                  <input type="number" placeholder="Biaya Transport" value={formAmbil.biayaTransport} onChange={e=>setFormAmbil({...formAmbil, biayaTransport:e.target.value})} className="p-2 border rounded text-sm" />
                </div>
                <button type="submit" className="w-full bg-amber-500 font-bold p-3 rounded-lg">Simpan ke Sheet Transaksi</button>
              </form>
            )}

            {/* TAB 2: PENGOLAHAN */}
            {activeTab === 'pengolahan' && (
              <div className="max-w-3xl mx-auto bg-white rounded-xl shadow border overflow-hidden">
                <div className="bg-slate-900 text-white p-5">
                  <h3 className="font-bold">🧪 Input Pengolahan & Pemurnian (Multi-Select Transaksi)</h3>
                </div>
                <form onSubmit={handleSavePengolahan} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase mb-2">Pilih Transaksi Siap Olah ({formOlah.selectedTrxIds.length} Dipilih)</label>
                    <div className="max-h-52 overflow-y-auto border rounded-lg divide-y">
                      {pendingOlahList.map(t => (
                        <label key={t.id} className="flex items-center justify-between p-3 cursor-pointer hover:bg-slate-50">
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={formOlah.selectedTrxIds.includes(t.id)} onChange={()=>handleToggleSelectOlah(t.id)} className="w-4 h-4 text-amber-500" />
                            <span className="font-bold text-xs">{t.id} - {t.kategoriName}</span>
                          </div>
                          <span className="text-xs font-mono">{t.jumlahKotor} Gram</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  <input type="text" placeholder="PIC Pengolah" value={formOlah.pengolahSelect} onChange={e=>setFormOlah({...formOlah, pengolahSelect:e.target.value})} className="w-full p-2 border rounded text-sm" />
                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" step="0.01" placeholder="Hasil Perak Murni (Gram)" value={formOlah.jumlahMurni} onChange={e=>setFormOlah({...formOlah, jumlahMurni:e.target.value})} className="p-2 border rounded text-sm font-bold text-blue-700" />
                    <input type="number" placeholder="Total Biaya Olah (Rp)" value={formOlah.biayaOlah} onChange={e=>setFormOlah({...formOlah, biayaOlah:e.target.value})} className="p-2 border rounded text-sm" />
                  </div>
                  <button type="submit" className="w-full bg-blue-600 text-white font-bold p-3 rounded-lg">Simpan & Update Pemurnian ➔</button>
                </form>
              </div>
            )}

            {/* TAB 3: PENJUALAN (MULTI-SELECT) */}
            {activeTab === 'penjualan' && (
              <div className="max-w-3xl mx-auto bg-white rounded-xl shadow border overflow-hidden">
                <div className="bg-slate-900 text-white p-5">
                  <h3 className="font-bold">💰 Input Penjualan Perak Murni (Multi-Select Barang)</h3>
                </div>
                <form onSubmit={handleSavePenjualan} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase mb-2">Pilih Barang Hasil Olahan Siap Jual ({formJual.selectedTrxIds.length} Dipilih)</label>
                    {pendingJualList.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-4 border rounded-lg">Tidak ada barang hasil olahan yang belum dijual.</p>
                    ) : (
                      <div className="max-h-52 overflow-y-auto border rounded-lg divide-y">
                        {pendingJualList.map(t => (
                          <label key={t.id} className="flex items-center justify-between p-3 cursor-pointer hover:bg-slate-50">
                            <div className="flex items-center gap-2">
                              <input type="checkbox" checked={formJual.selectedTrxIds.includes(t.id)} onChange={()=>handleToggleSelectJual(t.id)} className="w-4 h-4 text-emerald-600" />
                              <div>
                                <p className="font-bold text-xs">{t.id} - {t.kategoriName}</p>
                                <p className="text-[10px] text-slate-500">Pengolah: {t.pengolah}</p>
                              </div>
                            </div>
                            <span className="text-xs font-bold text-blue-600 font-mono">{t.jumlahMurni} Gram</span>
                          </label>
                        ))}
                      </div>
                    )}
                  </div>

                  {selectedTrxJualList.length > 0 && (
                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg flex justify-between text-xs font-bold text-slate-800">
                      <span>Total Perak Murni Terpilih:</span>
                      <span className="text-blue-700 font-mono">{totalMurniJualSelected.toFixed(2)} Gram</span>
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Penjualan</label>
                      <input type="date" value={formJual.tanggalJual} onChange={e=>setFormJual({...formJual, tanggalJual:e.target.value})} className="w-full p-2 border rounded text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">PIC Penjual (Otomatis)</label>
                      <input type="text" readOnly value={currentUser.nama} className="w-full p-2 border rounded text-sm bg-slate-100 font-bold text-slate-700" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Harga Jual Per Satuan / Gram (Rp)</label>
                      <input type="number" required placeholder="e.g. 15000" value={formJual.hargaJualSatuan} onChange={e=>setFormJual({...formJual, hargaJualSatuan:e.target.value})} className="w-full p-2 border rounded text-sm font-bold text-emerald-700" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Biaya Aktifitas Penjualan (Rp)</label>
                      <input type="number" placeholder="e.g. 50000" value={formJual.biayaPenjualan} onChange={e=>setFormJual({...formJual, biayaPenjualan:e.target.value})} className="w-full p-2 border rounded text-sm" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-emerald-600 text-white font-bold p-3 rounded-lg shadow">
                    Selesaikan Penjualan ({selectedTrxJualList.length} Barang) ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 4: LAPORAN TRANSAKSI */}
            {activeTab === 'dashboard' && (
              <div className="bg-white rounded-xl shadow overflow-hidden">
                <div className="p-4 border-b font-bold text-slate-800 flex justify-between items-center">
                  <span>Daftar Rekap Transaksi (Sheet Transaksi)</span>
                  <input type="text" placeholder="🔍 Cari..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="px-3 py-1 border rounded text-xs" />
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-white font-bold uppercase text-[10px]">
                      <tr>
                        <th className="p-3">Kode</th>
                        <th className="p-3">Tanggal</th>
                        <th className="p-3">Kategori</th>
                        <th className="p-3">PIC</th>
                        <th className="p-3">Lokasi</th>
                        <th className="p-3 text-right">Kotor (g)</th>
                        <th className="p-3 text-right">Total Beli</th>
                        <th className="p-3">Pengolah</th>
                        <th className="p-3 text-right">Murni (g)</th>
                        <th className="p-3 text-right">Biaya Olah</th>
                        <th className="p-3 font-bold">PIC Penjual</th>
                        <th className="p-3 text-right">Total Jual</th>
                        <th className="p-3 text-right">Biaya Penjualan</th>
                        <th className="p-3 text-right">Untung Bersih</th>
                        <th className="p-3 text-center">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {filteredTransactions.map((t, idx) => (
                        <tr key={idx} className="hover:bg-slate-50">
                          <td className="p-3 font-bold">{t.id}</td>
                          <td className="p-3">{t.tanggalAmbil}</td>
                          <td className="p-3">{t.kategoriName}</td>
                          <td className="p-3">{t.pengambil}</td>
                          <td className="p-3">{t.tempatAmbil} ({t.lokasiAmbil})</td>
                          <td className="p-3 text-right font-mono">{t.jumlahKotor}</td>
                          <td className="p-3 text-right font-mono">{formatRupiah(t.totalBeli)}</td>
                          <td className="p-3">{t.pengolah}</td>
                          <td className="p-3 text-right font-mono font-bold text-blue-600">{t.jumlahMurni}</td>
                          <td className="p-3 text-right font-mono">{formatRupiah(t.biayaOlah)}</td>
                          <td className="p-3 font-semibold text-slate-700">{t.tokoPembeli}</td>
                          <td className="p-3 text-right font-mono font-bold text-emerald-600">{formatRupiah(t.totalJual)}</td>
                          <td className="p-3 text-right font-mono text-slate-500">{formatRupiah(t.biayaPenjualan)}</td>
                          <td className="p-3 text-right font-mono font-bold text-amber-600">{formatRupiah(t.totalUntung)}</td>
                          <td className="p-3 text-center">
                            <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100">{t.status}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
