<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refining Perak System - Filter Laporan & Biaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // URL Web App Google Apps Script Terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2B_R0C4fSdVnesvWCQymBHVl214Dt2rUOP8Ugd-pYykONSpoYsXAif9cQvm4FMQeG/exec";

    const DEFAULT_CATEGORIES = [
      { code: 'A', name: 'Pentolan Kontaktor' },
      { code: 'B', name: 'Kontak Point' },
      { code: 'C', name: 'Ex Breaker' },
      { code: 'D', name: 'Mata Ikan (Ex Relay)' },
      { code: 'E', name: 'Mata Ikan (Ex Kontaktor)' },
      { code: 'F', name: 'Tembaga Plating Perak' },
      { code: 'G', name: 'Fuse' },
      { code: 'H', name: 'Patung' }
    ];

    function App() {
      // STATE AUTHENTICATION
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('perak_user_session');
        return saved ? JSON.parse(saved) : null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [signupNama, setSignupNama] = useState('');
      const [signupUsername, setSignupUsername] = useState('');
      const [signupPassword, setSignupPassword] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);

      // FILTER PERIODE TANGGAL & BULAN
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const [newCatCode, setNewCatCode] = useState('');
      const [newCatName, setNewCatName] = useState('');
      const [editingCatCode, setEditingCatCode] = useState(null);
      const [editCatNameText, setEditCatNameText] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      // FETCH CATEGORIES DARI GOOGLE SHEETS
      const loadCategoriesFromSheets = () => {
        fetch(SCRIPT_URL + '?type=categories&t=' + new Date().getTime())
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 1) {
              const formattedCats = data.slice(1).map(row => ({
                code: String(row[0] || '').trim(),
                name: String(row[1] || '').trim()
              })).filter(c => c.code && c.name);

              if (formattedCats.length > 0) setCategories(formattedCats);
            }
          })
          .catch(err => console.error("Gagal load kategori:", err));
      };

      const saveCategoriesToSheets = (newCatsList) => {
        setLoading(true);
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'SAVE_CATEGORIES', categories: newCatsList })
        })
        .then(() => {
          setTimeout(() => {
            setLoading(false);
            setCategories(newCatsList);
            showToast('✅ Varian Barang berhasil disimpan ke Google Sheets!');
          }, 1500);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal menyimpan varian barang!');
        });
      };

      // HANDLE LOGIN
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setAuthError('');
        setAuthSuccess('');

        fetch(SCRIPT_URL + '?type=users&t=' + new Date().getTime())
          .then(res => res.json())
          .then(usersData => {
            setLoading(false);
            if (Array.isArray(usersData) && usersData.length > 1) {
              const userMatch = usersData.slice(1).find(row => 
                String(row[1]).trim().toLowerCase() === loginUsername.trim().toLowerCase() && 
                String(row[2]).trim() === loginPassword.trim()
              );

              if (userMatch) {
                const userObj = {
                  nama: userMatch[0],
                  username: userMatch[1],
                  role: userMatch[3] || 'Petugas'
                };
                setCurrentUser(userObj);
                localStorage.setItem('perak_user_session', JSON.stringify(userObj));
                showToast(`Selamat datang, ${userObj.nama}!`);
              } else {
                setAuthError('Username atau Password salah!');
              }
            } else {
              setAuthError('Data akun tidak ditemukan di Google Sheets Users.');
            }
          })
          .catch(() => {
            setLoading(false);
            setAuthError('Gagal menghubungkan ke database user.');
          });
      };

      // HANDLE SIGN UP
      const handleSignUpSubmit = (e) => {
        e.preventDefault();
        if (!signupNama.trim() || !signupUsername.trim() || !signupPassword.trim()) {
          return setAuthError('Semua bidang harus diisi!');
        }

        setLoading(true);
        setAuthError('');
        setAuthSuccess('');

        const payload = {
          action: 'REGISTER_USER',
          nama: signupNama.trim(),
          username: signupUsername.trim(),
          password: signupPassword.trim(),
          role: 'Petugas'
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(() => {
          setTimeout(() => {
            setLoading(false);
            setAuthSuccess('🎉 Akun berhasil dibuat! Silakan masuk dengan username & password Anda.');
            setLoginUsername(signupUsername.trim());
            setSignupNama('');
            setSignupUsername('');
            setSignupPassword('');
            setAuthMode('login');
          }, 2000);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal mendaftarkan akun.');
        });
      };

      const handleLogout = () => {
        if (window.confirm('Yakin ingin keluar dari sistem?')) {
          setCurrentUser(null);
          localStorage.removeItem('perak_user_session');
        }
      };

      const formatCleanDate = (raw) => {
        if (!raw) return '';
        if (typeof raw === 'string' && raw.includes('T')) {
          return raw.split('T')[0];
        }
        const d = new Date(raw);
        if (isNaN(d.getTime())) return String(raw);
        return d.toISOString().split('T')[0];
      };

      // FETCH DATA DARI SHEET TRANSAKSI (30 KOLOM)
      const loadDataFromSheets = () => {
        if (!currentUser) return;
        setLoading(true);
        loadCategoriesFromSheets();

        fetch(SCRIPT_URL + '?t=' + new Date().getTime())
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 1) {
              const formattedTrx = data.slice(1).map((row) => {
                const totalJual = parseFloat(row[27]) || 0;
                const murni = parseFloat(row[10]) || 0;
                let status = 'MENUNGGU_OLAH';
                if (totalJual > 0) status = 'TERJUAL';
                else if (murni > 0) status = 'SELESAI_OLAH';

                return {
                  id: String(row[0] || '').trim(),
                  tanggalAmbil: formatCleanDate(row[1]),
                  kategoriName: row[2] || '',
                  pengambil: row[3] || '',
                  tempatAmbil: row[4] || '-',
                  lokasiAmbil: row[5] || '-',
                  jumlahKotor: parseFloat(row[6]) || 0,
                  totalBeli: parseFloat(row[7]) || 0,
                  biayaTransport: parseFloat(row[8]) || 0,
                  pengolah: row[9] || '-',
                  jumlahMurni: murni,
                  biayaOlah: parseFloat(row[11]) || 0,
                  efisiensi: parseFloat(row[12]) || 0,
                  tanggalPenjualan: formatCleanDate(row[21]),
                  tokoPembeli: row[28] || '-',
                  jumlahJual: parseFloat(row[25]) || 0,
                  hargaJualSatuan: parseFloat(row[26]) || 0,
                  totalJual: totalJual,
                  biayaPenjualan: parseFloat(row[29]) || 0,
                  totalUntung: totalJual > 0 ? (totalJual - (parseFloat(row[7]) || 0) - (parseFloat(row[8]) || 0) - (parseFloat(row[11]) || 0) - (parseFloat(row[29]) || 0)) : 0,
                  status: status
                };
              }).filter(t => t.id !== '');
              setTransactions(formattedTrx);
            } else {
              setTransactions([]);
            }
            setLoading(false);
          })
          .catch(err => {
            console.error("Gagal ambil data Sheets:", err);
            setLoading(false);
          });
      };

      useEffect(() => {
        if (currentUser) loadDataFromSheets();
      }, [currentUser]);

      // FORM PEMBELIAN
      const [formAmbil, setFormAmbil] = useState({
        tanggal: new Date().toISOString().split('T')[0],
        pengambilSelect: currentUser ? currentUser.nama : 'Andi',
        tempatAmbil: '',
        lokasiAmbil: '',
        kategoriCode: 'A',
        jumlahKotor: '',
        hargaBeliSatuan: '',
        biayaTransport: ''
      });

      // FORM PENGOLAHAN (MULTI-SELECT)
      const [formOlah, setFormOlah] = useState({
        selectedTrxIds: [],
        pengolahSelect: currentUser ? currentUser.nama : 'Zaenal',
        jumlahMurni: '',
        biayaOlah: ''
      });

      // FORM PENJUALAN (MULTI-SELECT)
      const [formJual, setFormJual] = useState({
        selectedTrxIds: [],
        tanggalJual: new Date().toISOString().split('T')[0],
        hargaJualSatuan: '',
        biayaPenjualan: ''
      });

      const formatRupiah = (val) => {
        if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
      };

      const sendToGoogleSheets = (dataObj, successMessage) => {
        setLoading(true);
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataObj)
        })
        .then(() => {
          setTimeout(() => {
            loadDataFromSheets();
            setLoading(false);
            showToast(successMessage || '✅ Data tersimpan di Sheet Transaksi!');
          }, 2500);
        })
        .catch(() => {
          setLoading(false);
          alert('Gagal mengirim data!');
        });
      };

      const handleDeleteTransaction = (id) => {
        if (window.confirm(`Yakin ingin menghapus data transaksi ${id} dari Sheet Transaksi?`)) {
          sendToGoogleSheets({ action: 'DELETE', id: id }, `🗑️ Transaksi ${id} berhasil dihapus!`);
        }
      };

      const handleSavePengambilan = (e) => {
        e.preventDefault();
        const pengambilFinal = formAmbil.pengambilSelect.trim();
        if (!pengambilFinal || !formAmbil.tempatAmbil.trim() || !formAmbil.lokasiAmbil.trim()) {
          return alert('Semua bidang sumber & lokasi harus diisi!');
        }

        const kotor = parseFloat(formAmbil.jumlahKotor) || 0;
        const hargaBeli = parseFloat(formAmbil.hargaBeliSatuan) || 0;
        const transport = parseFloat(formAmbil.biayaTransport) || 0;

        if (kotor <= 0 || hargaBeli <= 0) return alert('Jumlah kotor dan harga beli harus > 0!');

        const selectedCat = categories.find(c => c.code === formAmbil.kategoriCode) || categories[0] || { code: 'A', name: 'Umum' };

        const payload = {
          tanggalAmbil: formAmbil.tanggal,
          kategoriName: `[${selectedCat.code}] ${selectedCat.name}`,
          pengambil: pengambilFinal,
          tempatAmbil: formAmbil.tempatAmbil.trim(),
          lokasiAmbil: formAmbil.lokasiAmbil.trim(),
          jumlahKotor: kotor,
          totalBeli: kotor * hargaBeli,
          biayaTransport: transport
        };

        sendToGoogleSheets(payload, '🎉 Transaksi Pembelian baru berhasil masuk ke Sheet Transaksi!');
        setFormAmbil({ ...formAmbil, tempatAmbil: '', lokasiAmbil: '', jumlahKotor: '', hargaBeliSatuan: '', biayaTransport: '' });
        setActiveTab('dashboard');
      };

      // TOGGLE SELECT PENGOLAHAN
      const handleToggleSelectOlah = (id) => {
        const current = formOlah.selectedTrxIds;
        if (current.includes(id)) setFormOlah({ ...formOlah, selectedTrxIds: current.filter(x => x !== id) });
        else setFormOlah({ ...formOlah, selectedTrxIds: [...current, id] });
      };

      // TOGGLE SELECT PENJUALAN
      const handleToggleSelectJual = (id) => {
        const current = formJual.selectedTrxIds;
        if (current.includes(id)) setFormJual({ ...formJual, selectedTrxIds: current.filter(x => x !== id) });
        else setFormJual({ ...formJual, selectedTrxIds: [...current, id] });
      };

      const selectedTrxOlahList = transactions.filter(t => formOlah.selectedTrxIds.includes(t.id));
      const totalKotorSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.jumlahKotor, 0);
      const totalModalSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.totalBeli, 0);

      const murniVal = parseFloat(formOlah.jumlahMurni) || 0;
      const totalBiayaOlahVal = parseFloat(formOlah.biayaOlah) || 0;
      const penyusutanGram = totalKotorSelected > 0 && murniVal > 0 ? (totalKotorSelected - murniVal) : 0;
      const persentaseSusut = totalKotorSelected > 0 && murniVal > 0 ? ((penyusutanGram / totalKotorSelected) * 100).toFixed(2) : 0;
      const overallEfisiensi = totalKotorSelected > 0 && murniVal > 0 ? ((murniVal / totalKotorSelected) * 100).toFixed(2) : 0;

      const handleSavePengolahan = (e) => {
        e.preventDefault();
        if (formOlah.selectedTrxIds.length === 0) return alert('Pilih minimal 1 transaksi!');
        if (murniVal <= 0) return alert('Hasil Perak Murni harus > 0!');

        const updatedItems = selectedTrxOlahList.map(t => {
          const porsiGram = t.jumlahKotor / totalKotorSelected;
          const murniItem = parseFloat((murniVal * porsiGram).toFixed(2));
          const biayaItem = parseFloat((totalBiayaOlahVal * porsiGram).toFixed(0));
          const efisiensiItem = parseFloat(((murniItem / t.jumlahKotor) * 100).toFixed(2));

          return {
            ...t,
            pengolah: formOlah.pengolahSelect.trim(),
            jumlahMurni: murniItem,
            biayaOlah: biayaItem,
            efisiensi: efisiensiItem
          };
        });

        sendToGoogleSheets({ action: 'BATCH_UPDATE_OLAH', items: updatedItems }, '🧪 Data Pemurnian berhasil di-update di Sheet Transaksi!');
        setFormOlah({ selectedTrxIds: [], pengolahSelect: currentUser.nama, jumlahMurni: '', biayaOlah: '' });
        setActiveTab('dashboard');
      };

      // PROSES PENJUALAN MULTI-SELECT
      const selectedTrxJualList = transactions.filter(t => formJual.selectedTrxIds.includes(t.id));
      const totalMurniJualSelected = selectedTrxJualList.reduce((sum, t) => sum + t.jumlahMurni, 0);
      const hargaJualVal = parseFloat(formJual.hargaJualSatuan) || 0;
      const totalBiayaPenjualanVal = parseFloat(formJual.biayaPenjualan) || 0;

      const handleSavePenjualan = (e) => {
        e.preventDefault();
        if (formJual.selectedTrxIds.length === 0) return alert('Pilih minimal 1 barang hasil olahan yang akan dijual!');
        if (hargaJualVal <= 0) return alert('Harga jual per gram harus > 0!');

        const updatedItems = selectedTrxJualList.map(t => {
          const porsiMurni = t.jumlahMurni / totalMurniJualSelected;
          const totalJualItem = parseFloat((t.jumlahMurni * hargaJualVal).toFixed(0));
          const biayaPenjualanItem = parseFloat((totalBiayaPenjualanVal * porsiMurni).toFixed(0));

          return {
            ...t,
            tanggalJual: formJual.tanggalJual,
            jumlahJual: t.jumlahMurni,
            hargaJualSatuan: hargaJualVal,
            totalJual: totalJualItem,
            picPenjual: currentUser.nama,
            biayaPenjualan: biayaPenjualanItem
          };
        });

        sendToGoogleSheets({ action: 'BATCH_UPDATE_PENJUALAN', items: updatedItems }, `💰 Penjualan ${updatedItems.length} barang berhasil dicatat di Sheet Transaksi!`);
        setFormJual({ selectedTrxIds: [], tanggalJual: new Date().toISOString().split('T')[0], hargaJualSatuan: '', biayaPenjualan: '' });
        setActiveTab('dashboard');
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCatCode.trim() || !newCatName.trim()) return;
        const codeUpper = newCatCode.trim().toUpperCase();
        if (categories.some(c => c.code === codeUpper)) return alert('Kode Kategori sudah ada!');

        const updated = [...categories, { code: codeUpper, name: newCatName.trim() }];
        saveCategoriesToSheets(updated);
        setNewCatCode('');
        setNewCatName('');
      };

      const handleSaveEditCategory = (code) => {
        if (!editCatNameText.trim()) return;
        const updated = categories.map(c => c.code === code ? { ...c, name: editCatNameText.trim() } : c);
        saveCategoriesToSheets(updated);
        setEditingCatCode(null);
        setEditCatNameText('');
      };

      const handleDeleteCategory = (code) => {
        if (window.confirm(`Hapus kategori [${code}]?`)) {
          const updated = categories.filter(c => c.code !== code);
          saveCategoriesToSheets(updated);
        }
      };

      // PRESET FILTER BULAN / PERIODE
      const handleSetMonthFilter = (year, monthIndex) => {
        const start = new Date(year, monthIndex, 1);
        const end = new Date(year, monthIndex + 1, 0);
        
        const formatYYYYMMDD = (d) => d.toISOString().split('T')[0];
        setStartDate(formatYYYYMMDD(start));
        setEndDate(formatYYYYMMDD(end));
      };

      const handleQuickFilter = (type) => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        if (type === 'THIS_MONTH') {
          handleSetMonthFilter(year, month);
        } else if (type === 'LAST_MONTH') {
          handleSetMonthFilter(month === 0 ? year - 1 : year, month === 0 ? 11 : month - 1);
        } else if (type === 'THIS_YEAR') {
          setStartDate(`${year}-01-01`);
          setEndDate(`${year}-12-31`);
        } else if (type === 'CLEAR') {
          setStartDate('');
          setEndDate('');
        }
      };

      // FILTERING TRANSAKSI
      const dateFilteredTransactions = transactions.filter(t => {
        const tDate = t.tanggalAmbil;
        if (!tDate) return true;

        if (startDate && tDate < startDate) return false;
        if (endDate && tDate > endDate) return false;
        return true;
      });

      const filteredTransactions = dateFilteredTransactions.filter(t => {
        const term = searchTerm.toLowerCase();
        return (
          t.id.toLowerCase().includes(term) ||
          t.kategoriName.toLowerCase().includes(term) ||
          t.pengambil.toLowerCase().includes(term) ||
          (t.tempatAmbil && t.tempatAmbil.toLowerCase().includes(term)) ||
          (t.lokasiAmbil && t.lokasiAmbil.toLowerCase().includes(term)) ||
          (t.pengolah && t.pengolah.toLowerCase().includes(term)) ||
          (t.tokoPembeli && t.tokoPembeli.toLowerCase().includes(term))
        );
      });

      const totalBarangKotor = filteredTransactions.reduce((acc, t) => acc + (t.jumlahKotor || 0), 0);
      const totalPerakMurni = filteredTransactions.reduce((acc, t) => acc + (t.jumlahMurni || 0), 0);
      const totalBeliModal = filteredTransactions.reduce((acc, t) => acc + (t.totalBeli || 0), 0);
      const totalOmsetPenjualan = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalJual || 0), 0);
      const totalLabaBersih = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalUntung || 0), 0);

      // REKAP BIAYA AKTIVITAS PER AKUN
      const getAccountActivityRecap = () => {
        const recapMap = {};

        dateFilteredTransactions.forEach(t => {
          if (t.pengambil && t.pengambil !== '-') {
            const pic = t.pengambil.trim();
            if (!recapMap[pic]) recapMap[pic] = { transport: 0, olah: 0, jual: 0, count: 0 };
            recapMap[pic].transport += (t.biayaTransport || 0);
            recapMap[pic].count += 1;
          }

          if (t.pengolah && t.pengolah !== '-') {
            const pic = t.pengolah.trim();
            if (!recapMap[pic]) recapMap[pic] = { transport: 0, olah: 0, jual: 0, count: 0 };
            recapMap[pic].olah += (t.biayaOlah || 0);
          }

          if (t.tokoPembeli && t.tokoPembeli !== '-') {
            const pic = t.tokoPembeli.trim();
            if (!recapMap[pic]) recapMap[pic] = { transport: 0, olah: 0, jual: 0, count: 0 };
            recapMap[pic].jual += (t.biayaPenjualan || 0);
          }
        });

        return Object.keys(recapMap).map(pic => ({
          nama: pic,
          transport: recapMap[pic].transport,
          olah: recapMap[pic].olah,
          jual: recapMap[pic].jual,
          totalBiaya: recapMap[pic].transport + recapMap[pic].olah + recapMap[pic].jual,
          count: recapMap[pic].count
        }));
      };

      const accountRecapList = getAccountActivityRecap();

      const pendingOlahList = transactions.filter(t => t.status === 'MENUNGGU_OLAH');
      const pendingJualList = transactions.filter(t => t.status === 'SELESAI_OLAH');

      // JIKA BELUM LOGIN
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center px-4 py-8">
            {loading && (
              <div className="fixed inset-0 bg-slate-900/80 z-50 flex flex-col items-center justify-center text-white">
                <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p className="text-sm font-bold">Memproses Data...</p>
              </div>
            )}

            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-800">
              <div className="text-center mb-6">
                <div className="inline-block bg-amber-500 text-slate-900 p-3 rounded-2xl font-black text-3xl mb-2">Ag</div>
                <h2 className="text-2xl font-bold text-slate-800">Refining Perak System</h2>
                <p className="text-xs text-slate-500 mt-1">Connected to Sheet Transaksi</p>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    authMode === 'login' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Masuk (Sign In)
                </button>
                <button
                  onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${

                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                        📅 Filter Periode Tanggal Laporan
                      </h3>
                      <p className="text-[11px] text-slate-500">Pilih rentang tanggal untuk menyaring ringkasan metrik dan rekap biaya.</p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <button onClick={() => handleQuickFilter('THIS_MONTH')} className="px-3 py-1.5 bg-slate-100 hover:bg-amber-100 hover:text-amber-900 border text-slate-700 text-xs font-bold rounded-lg transition">Bulan Ini</button>
                      <button onClick={() => handleQuickFilter('LAST_MONTH')} className="px-3 py-1.5 bg-slate-100 hover:bg-amber-100 hover:text-amber-900 border text-slate-700 text-xs font-bold rounded-lg transition">Bulan Lalu</button>
                      <button onClick={() => handleQuickFilter('THIS_YEAR')} className="px-3 py-1.5 bg-slate-100 hover:bg-amber-100 hover:text-amber-900 border text-slate-700 text-xs font-bold rounded-lg transition">Tahun Ini</button>
                      <button onClick={() => handleQuickFilter('CLEAR')} className="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-lg transition">Reset Filter</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Dari Tanggal:</label>
                      <input
                        type="date"
                        value={startDate}
                        onChange={(e) => setStartDate(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500 bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Sampai Tanggal:</label>
                      <input
                        type="date"
                        value={endDate}
                        onChange={(e) => setEndDate(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500 bg-white"
                      />
                    </div>
                    <div className="flex items-end">
                      <div className="text-xs text-slate-500 p-2 bg-slate-50 border rounded-lg w-full font-semibold">
                        Menampilkan <b className="text-slate-900">{filteredTransactions.length}</b> dari {transactions.length} transaksi
                      </div>
                    </div>
                  </div>
                </div>

                {/* RINGKASAN METRIK UTAMA */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Total Barang Mentah</span>
                    <p className="text-2xl font-black text-slate-800 mt-1">{totalBarangKotor.toFixed(2)} <span className="text-sm font-normal">Gram</span></p>
                    <span className="text-xs text-slate-500 mt-1 block">Modal Beli: {formatRupiah(totalBeliModal)}</span>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Hasil Perak Murni</span>
                    <p className="text-2xl font-black text-blue-600 mt-1">{totalPerakMurni.toFixed(2)} <span className="text-sm font-normal">Gram</span></p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Total Omset Penjualan</span>
                    <p className="text-2xl font-black text-emerald-600 mt-1">{formatRupiah(totalOmsetPenjualan)}</p>
                  </div>
                  {currentUser.role === 'Admin' && (
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                      <span className="text-xs font-semibold text-slate-400 uppercase">Total Laba Bersih</span>
                      <p className="text-2xl font-black text-amber-600 mt-1">{formatRupiah(totalLabaBersih)}</p>
                    </div>
                  )}
                </div>

                {/* REKAP BIAYA AKTIVITAS PER AKUN */}
                <div className="bg-white rounded-xl shadow border border-amber-200 overflow-hidden">
                  <div className="bg-amber-500 text-slate-900 p-4 font-bold text-sm flex justify-between items-center">
                    <span>💵 Recap Biaya Aktifitas per Akun (PIC)</span>
                    <span className="text-xs bg-slate-900 text-amber-400 px-2 py-1 rounded">Sheet Transaksi</span>
                  </div>
                  <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                    {accountRecapList.length === 0 ? (
                      <p className="text-xs text-slate-400 col-span-3 text-center py-2">Tidak ada transaksi biaya aktivitas pada periode tanggal ini.</p>
                    ) : (
                      accountRecapList.map((acc, idx) => (
                        <div key={idx} className="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-2">
                          <div className="flex justify-between items-center border-b pb-2">
                            <span className="font-bold text-slate-800 text-sm">👤 {acc.nama}</span>
                            <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">{acc.count} Transaksi</span>
                          </div>
                          <div className="text-xs space-y-1 text-slate-600">
                            <div className="flex justify-between">
                              <span>Biaya Transport/Pembelian:</span>
                              <span className="font-mono font-bold text-slate-800">{formatRupiah(acc.transport)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span>Biaya Pengolahan:</span>
                              <span className="font-mono font-bold text-slate-800">{formatRupiah(acc.olah)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span>Biaya Penjualan:</span>
                              <span className="font-mono font-bold text-slate-800">{formatRupiah(acc.jual)}</span>
                            </div>
                            <div className="flex justify-between border-t pt-1 font-bold text-amber-700">
                              <span>Total Biaya Aktifitas:</span>
                              <span className="font-mono">{formatRupiah(acc.totalBiaya)}</span>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {/* TABEL REKAP TRANSAKSI LENGKAP */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-5 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                    <h3 className="font-bold text-slate-800">Daftar Transaksi (Google Sheets - Sheet Transaksi)</h3>
                    <input
                      type="text"
                      placeholder="🔍 Cari kode, tempat, pengolah..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="px-3 py-1.5 border rounded-lg text-xs outline-none w-full md:w-64"
                    />
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-white uppercase text-[10px] font-bold">
                        <tr>
                          <th className="px-3 py-3">Kode Transaksi</th>
                          <th className="px-3 py-3">Tanggal</th>
                          <th className="px-3 py-3">Kode & Deskripsi Brg</th>
                          <th className="px-3 py-3">PIC</th>
                          <th className="px-3 py-3">Lokasi & Daerah</th>
                          <th className="px-3 py-3 text-right">Total Jumlah Brg (g)</th>
                          <th className="px-3 py-3 text-right">Total Harga</th>
                          <th className="px-3 py-3 text-right">Biaya Aktifitas</th>
                          <th className="px-3 py-3">PIC Pengolah</th>
                          <th className="px-3 py-3 text-right">Hasil Pengolahan (g)</th>
                          <th className="px-3 py-3 text-right">Biaya Pengolahan</th>
                          <th className="px-3 py-3 text-center">Efisiensi</th>
                          <th className="px-3 py-3 font-bold">PIC Penjual</th>
                          <th className="px-3 py-3 text-right">Total Jual</th>
                          <th className="px-3 py-3 text-right">Biaya Penjualan</th>
                          {currentUser.role === 'Admin' && <th className="px-3 py-3 text-right">Untung Bersih</th>}
                          <th className="px-3 py-3 text-center">Status</th>
                          {currentUser.role === 'Admin' && <th className="px-3 py-3 text-center">Aksi</th>}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredTransactions.length === 0 ? (
                          <tr>
                            <td colSpan="18" className="text-center py-6 text-slate-400">Tidak ada transaksi yang sesuai dengan filter.</td>
                          </tr>
                        ) : (
                          filteredTransactions.map((t, idx) => (
                            <tr key={idx} className="hover:bg-slate-50 transition">
                              <td className="px-3 py-3 font-bold text-slate-700">{t.id}</td>
                              <td className="px-3 py-3">{t.tanggalAmbil}</td>
                              <td className="px-3 py-3 font-semibold text-slate-600">{t.kategoriName}</td>
                              <td className="px-3 py-3">{t.pengambil}</td>
                              <td className="px-3 py-3">
                                <p className="font-semibold text-slate-800">{t.tempatAmbil || '-'}</p>
                                <p className="text-[10px] text-slate-500">📍 {t.lokasiAmbil || '-'}</p>
                              </td>
                              <td className="px-3 py-3 text-right font-mono">{t.jumlahKotor}</td>
                              <td className="px-3 py-3 text-right font-mono">{formatRupiah(t.totalBeli)}</td>
                              <td className="px-3 py-3 text-right font-mono text-slate-500">{formatRupiah(t.biayaTransport)}</td>
                              <td className="px-3 py-3 font-semibold">{t.pengolah}</td>
                              <td className="px-3 py-3 text-right font-mono font-bold text-blue-600">{t.jumlahMurni}</td>
                              <td className="px-3 py-3 text-right font-mono text-slate-500">{formatRupiah(t.biayaOlah)}</td>
                              <td className="px-3 py-3 text-center font-bold text-blue-600">{t.efisiensi}%</td>
                              <td className="px-3 py-3 font-semibold text-slate-800">{t.tokoPembeli}</td>
                              <td className="px-3 py-3 text-right font-mono font-bold text-emerald-600">{formatRupiah(t.totalJual)}</td>
                              <td className="px-3 py-3 text-right font-mono text-slate-500">{formatRupiah(t.biayaPenjualan)}</td>
                              {currentUser.role === 'Admin' && (
                                <td className="px-3 py-3 text-right font-mono font-bold text-amber-600">{formatRupiah(t.totalUntung)}</td>
                              )}
                              <td className="px-3 py-3 text-center">
                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                  t.status === 'TERJUAL' ? 'bg-emerald-100 text-emerald-800' :
                                  t.status === 'SELESAI_OLAH' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
                                }`}>
                                  {t.status}
                                </span>
                              </td>
                              {currentUser.role === 'Admin' && (
                                <td className="px-3 py-3 text-center">
                                  <button
                                    onClick={() => handleDeleteTransaction(t.id)}
                                    className="text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-red-50 hover:bg-red-100 rounded text-xs"
                                    title="Hapus Transaksi Ini"
                                  >
                                    🗑️ Hapus
                                  </button>
                                </td>
                              )}
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 5: KELOLA VARIAN BARANG */}
            {activeTab === 'kategori' && currentUser.role === 'Admin' && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                  <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">➕ Tambah Varian Jenis Barang Baru</h3>
                  <form onSubmit={handleAddCategory} className="flex flex-col sm:flex-row gap-3">
                    <input type="text" placeholder="Kode (e.g. H)" required value={newCatCode} onChange={(e) => setNewCatCode(e.target.value)} className="w-full sm:w-28 px-3 py-2 border rounded-lg text-sm uppercase font-bold outline-none" />
                    <input type="text" placeholder="Nama Varian Barang" required value={newCatName} onChange={(e) => setNewCatName(e.target.value)} className="flex-1 px-3 py-2 border rounded-lg text-sm outline-none" />
                    <button type="submit" className="bg-amber-500 hover:bg-amber-600 text-slate-900 px-5 py-2 rounded-lg text-sm font-bold whitespace-nowrap">+ Tambah Varian</button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                  <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">📋 Daftar Varian Jenis Barang (Tersimpan di Sheet 'Kategori')</h3>
                  <div className="divide-y divide-slate-100 border rounded-lg overflow-hidden">
                    {categories.map((cat) => (
                      <div key={cat.code} className="p-3.5 flex items-center justify-between gap-3 hover:bg-slate-50 transition">
                        {editingCatCode === cat.code ? (
                          <div className="flex items-center gap-2 flex-1">
                            <span className="font-bold text-xs bg-slate-200 px-2.5 py-1 rounded">[{cat.code}]</span>
                            <input type="text" value={editCatNameText} onChange={(e) => setEditCatNameText(e.target.value)} className="flex-1 px-2.5 py-1 border rounded text-xs outline-none" />
                            <button onClick={() => handleSaveEditCategory(cat.code)} className="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">Simpan</button>
                            <button onClick={() => setEditingCatCode(null)} className="bg-slate-300 text-slate-700 px-3 py-1 rounded text-xs font-bold">Batal</button>
                          </div>
                        ) : (
                          <>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded">[{cat.code}]</span>
                              <span className="text-sm font-semibold text-slate-700">{cat.name}</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => { setEditingCatCode(cat.code); setEditCatNameText(cat.name); }} className="text-blue-600 text-xs font-bold px-2 py-1 bg-blue-50 rounded">✏ Edit</button>
                              <button onClick={() => handleDeleteCategory(cat.code)} className="text-red-500 text-xs font-bold px-2 py-1 bg-red-50 rounded">🗑️ Hapus</button>
                            </div>
                          </>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
